<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Connect Gmail</title>
<!--
  bulb's short Gmail link (11/18, M691 #8; GMAIL_SHORT_LINK). bulb's first text carried Google's whole sign-in address,
  about 600 characters. Now it carries this page's address with a short fragment after '#':
    c = the Web client's id, s = the state, p = the PKCE challenge, k = r (read) or s (read and drafts),
    h = the address Google's account chooser opens on (optional, M780).
  This page builds Google's sign-in address from them and goes there at once. The fragment never reaches the web
  server (browsers do not send it), the page stores nothing and loads nothing from anywhere else. Google sends the
  browser back to the relay page (../), which does the rest as before. When this file changes, copy it to
  Estelle-LH/bulb-relay as gmail/go/index.html (docs/gmail-phone.md).
-->
<style>
  :root { --bg: #ffffff; --text: #1d1d1f; --muted: #5f6368; --accent: #0b57d0; --accent-text: #ffffff;
          --box: #f1f3f4; --line: #dadce0; --ok: #188038; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --text: #ececec; --muted: #a8adb3; --accent: #8ab4f8; --accent-text: #0b1b33;
            --box: #222426; --line: #3c4043; --ok: #81c995; }
  }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 19px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         -webkit-text-size-adjust: 100%; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px 40px; }
  .brand { display: flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; margin: 0 0 40px; }
  .brand svg { width: 44px; height: 44px; flex: none; }
  .badge { width: 56px; height: 56px; margin: 0 0 16px; display: block; }
  h1 { font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; margin: 0 0 12px; }
  p { margin: 0 0 20px; color: var(--muted); }
  .btn { display: block; box-sizing: border-box; width: 100%; margin: 12px 0 0; padding: 17px 16px; border-radius: 14px;
         border: 0; background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
         text-align: center; text-decoration: none; }
  .btn.quiet { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .foot { margin: 48px 0 0; font-size: 14px; color: var(--muted); }
  .foot a { color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand" aria-label="bulb">
    <svg viewBox="150 90 724 830" aria-hidden="true">
      <g stroke="#ffb800" stroke-width="34" stroke-linecap="round">
        <line x1="512" y1="118" x2="512" y2="168"/><line x1="290" y1="200" x2="320" y2="240"/>
        <line x1="734" y1="200" x2="704" y2="240"/><line x1="190" y1="390" x2="240" y2="405"/>
        <line x1="834" y1="390" x2="784" y2="405"/>
      </g>
      <path d="M512 215 C 680 215 780 335 780 470 C 780 560 735 615 690 665 C 660 700 650 725 648 760 L 376 760 C 374 725 364 700 334 665 C 289 615 244 560 244 470 C 244 335 344 215 512 215 Z" fill="#ffd84d" stroke="#e8a300" stroke-width="16"/>
      <path d="M350 400 C 360 330 410 285 470 270" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" opacity="0.75"/>
      <ellipse cx="435" cy="490" rx="26" ry="34" fill="#3b2f2f"/><ellipse cx="589" cy="490" rx="26" ry="34" fill="#3b2f2f"/>
      <path d="M470 560 Q 512 605 554 560" fill="none" stroke="#3b2f2f" stroke-width="16" stroke-linecap="round"/>
      <rect x="380" y="760" width="264" height="50" rx="25" fill="#9aa3b2"/>
      <rect x="392" y="812" width="240" height="46" rx="23" fill="#7f8898"/>
      <path d="M440 860 L 584 860 Q 572 905 512 905 Q 452 905 440 860 Z" fill="#5e6675"/>
    </svg>
    <span>bulb</span>
  </div>
  <h1 id="title">Opening Google&hellip;</h1>
  <p id="msg">One moment.</p>
  <p class="foot">bulb, from LightHouse Wealth Partners. <a href="/privacy/">Privacy</a></p>
</main>
<script>
(function () {
  var AUTH = "https://accounts.google.com/o/oauth2/v2/auth";
  var READ = "https://www.googleapis.com/auth/gmail.readonly";
  var COMPOSE = "https://www.googleapis.com/auth/gmail.compose";
  var f = new URLSearchParams(location.hash.slice(1));
  var c = f.get("c"), s = f.get("s"), p = f.get("p"), k = f.get("k");
  if (!c || !s || !p || (k !== "r" && k !== "s")) {
    document.getElementById("title").textContent = "This link is not complete";
    document.getElementById("msg").textContent = "Text bulb \"gmail\" and it will send you a new one.";
    return;
  }
  var q = new URLSearchParams({
    client_id: c, redirect_uri: location.origin + "/gmail/", response_type: "code",
    scope: k === "s" ? READ + " " + COMPOSE : READ, code_challenge: p, code_challenge_method: "S256", state: s,
    access_type: "offline", prompt: "consent"
  });
  if (k === "s") { q.set("include_granted_scopes", "true"); }
  if (f.get("h")) { q.set("login_hint", f.get("h")); }   // M780: the address to sign in as
  location.replace(AUTH + "?" + q.toString());
})();
</script>
</body>
</html>
