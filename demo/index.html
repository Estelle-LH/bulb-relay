<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bulb demo, step by step</title><meta name="description" content="What you see when you text Bulb and try its demo household: your phone, the page Bulb texts you, and the household as Bulb learns it. Nothing in it is real."><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="walk.css"></head><body>
<div class="wrap">
  <header>
    <h1>The Bulb demo, step by step</h1>
    <p>Your texts with Bulb, and what Bulb's backend does at each step in the process.</p>
      </header>
  <nav class="steps" id="steps" aria-label="Demo steps"></nav>
  <section class="now">
    <div class="nowtext"><h2 id="title"></h2><p id="say"></p></div>
    <div class="nav"><button type="button" id="prev">Back</button><button type="button" id="next">Next</button></div>
  </section>
  <div class="grid">
    <div class="card"><h3><span>Your texts</span></h3><div class="phone" id="phone"></div></div>
    <div class="card"><h3><span>Bulb's backend</span><span>on your computer, from the link Bulb texts you</span></h3><div class="office" id="office"></div></div>
    <div class="card mapcard"><h3><span>The household</span><span id="mapcount"></span></h3><div class="maplegend"><span><i class="ring a"></i>Needs Attention</span><span><i class="ring s"></i>Taken Care Of</span></div><div class="mapwrap"><svg id="map" viewBox="0 0 900 640" role="img" aria-label="The household map at this step"></svg></div></div>
  </div>
</div>
<script src="walk.js" defer></script>
</body></html>
